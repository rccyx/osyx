# =============================================================================
# hyprsunset.conf — automatic color temperature schedule
# =============================================================================
#
# Hardware brightness remains controlled by brightnessctl.
# Hyprsunset changes color temperature only, preserving normal gamma and
# avoiding unnecessary color-accuracy loss.
#
# Each profile replaces the previous profile completely.

profile {
    time = 07:30
    identity = true
}

profile {
    time = 20:30
    temperature = 4500
}

profile {
    time = 23:30
    temperature = 3500
}