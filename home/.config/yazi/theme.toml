# generated by flavors

[mgr]
cwd = { fg = "#c28961", bold = true }
border_symbol = "│"
border_style = { fg = "darkgray" }
find_keyword = { fg = "#c28961", bold = true, italic = false }
marker_marked = { fg = "#c28961", bg = "#c28961" }
marker_selected = { fg = "#c28961", bg = "#c28961" }
count_selected = { fg = "#e0cdbf", bg = "reset" }

[indicator]
current = { fg = "#c28961", bg = "reset", bold = true, reversed = false }
parent = { fg = "#e0cdbf", bg = "reset", reversed = false }
preview = { fg = "#e0cdbf", underline = false }
padding = { open = "", close = "" }

[mode]
normal_main = { fg = "#e0cdbf", bg = "reset", bold = true }
normal_alt = { fg = "darkgray", bg = "reset" }
select_main = { fg = "#c28961", bg = "reset", bold = true }
select_alt = { fg = "darkgray", bg = "reset" }
unset_main = { fg = "#c28961", bg = "reset", bold = true }
unset_alt = { fg = "darkgray", bg = "reset" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

[tabs]
active = { fg = "#c28961", bg = "reset", bold = true }
inactive = { fg = "gray", bg = "reset" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = "", close = "" }


[input]
border = { fg = "#c28961" }
border_set = { as = "rounded" }

[pick]
border = { fg = "#c28961" }
border_set = { as = "rounded" }

[confirm]
border = { fg = "#c28961" }
border_set = { as = "rounded" }

[spot]
border = { fg = "#c28961" }
border_set = { as = "rounded" }

[help]
border = { fg = "#c28961" }
border_set = { as = "rounded" }


[filetype]
rules = [
    { url = "*", is = "orphan", fg = "red" },
    { url = "*/", fg = "#e0cdbf" },
]

[icon]
globs = []
dirs = []
files = []
exts = []
conds = [
    { if = "hovered", text = "›" },
    { if = "dir", text = "▸", fg = "gray" },
    { if = "!dir", text = " " },
]
