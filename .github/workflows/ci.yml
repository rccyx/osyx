name: CI

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: Release
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    if: github.actor == 'rccyx'
    uses: ./.github/workflows/on-workflow-call-check-secrets.yml
    secrets: inherit

  changes:
    uses: ./.github/workflows/on-workflow-call-changes.yml
    needs: secrets
    with:
      directory: .
      ignore_docs: true

  powyx-changes:
    uses: ./.github/workflows/on-workflow-call-changes.yml
    with:
      directory: packages/powyx
      ignore_docs: true

  powyx:
    needs: powyx-changes
    if: needs.powyx-changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-powyx.yml


  syncer-changes:
    uses: ./.github/workflows/on-workflow-call-changes.yml
    with:
      directory: packages/syncer
      ignore_docs: true

  syncer:
    needs: syncer-changes
    if: needs.syncer-changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-syncer.yml

  totpyx-changes:
    uses: ./.github/workflows/on-workflow-call-changes.yml
    with:
      directory: packages/totpyx
      ignore_docs: true

  totpyx:
    needs: syncer-changes
    if: needs.totpyx-changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-totpyx.yml


  zsh-changes:
    uses: ./.github/workflows/on-workflow-call-changes.yml
    with:
      directory: config/
      ignore_docs: true

  zsh:
    needs: syncer-changes
    if: needs.zsh-changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-zsh.yml


  hypr-builder-changes:
    uses: ./.github/workflows/on-workflow-call-changes.yml
    with:
      directory: builders/
      ignore_docs: true

  hypr-builder:
    needs: hypr-builder-changes
    if: needs.hypr-builder-changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-hypr-builder.yml


  lint:
    needs: [secrets, changes]
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-lint.yml

  submodules:
    needs: [secrets, changes]
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-submodule-integrity.yml
    secrets: inherit

  nix:
    needs: [secrets, changes]
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-nix.yml

  duplicates:
    needs: [secrets, changes]
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-duplicate-configs.yml

  forbidden:
    needs: [secrets, changes]
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-forbidden-blobs.yml

  bootstrap:
    needs: [secrets, changes]
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-bootstrap.yml

  apps:
    needs: [secrets, changes]
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/on-workflow-call-apps.yml
