name: changes

on:
  workflow_call:
    inputs:
      directory:
        description: repository-relative directory to watch
        default: .
        type: string

      paths:
        description: newline-delimited repository paths to watch
        default: ""
        type: string

      ignore_docs:
        description: skip when only documentation changed
        required: true
        type: boolean

    outputs:
      changed:
        description: true when the current update changed a relevant file
        value: ${{ jobs.detect.outputs.changed }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.detect.outputs.changed }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: detect changes
        id: detect
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
          PATHS: ${{ inputs.paths }}
          IGNORE_DOCS: ${{ inputs.ignore_docs }}

          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}

          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}

          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t watched <<< "${PATHS:-$DIRECTORY}"

          base=""
          head="$CURRENT_SHA"

          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD_SHA"

              if [[ "$EVENT_ACTION" == synchronize && -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
                base="$EVENT_BEFORE"
              else
                if ! base="$(git merge-base "$PR_BASE_SHA" "$head")"; then
                  echo 'changed=true' >>"$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              ;;

            push)
              head="${EVENT_AFTER:-$CURRENT_SHA}"
              if [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
                base="$EVENT_BEFORE"
              fi
              ;;

            *)
              if git rev-parse "$head^" >/dev/null 2>&1; then
                base="$(git rev-parse "$head^")"
              fi
              ;;
          esac

          # a force-push can leave the previous commit unreachable
          if [[ -n "$base" ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'changed=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT

          if [[ -n "$base" ]]; then
            # inspect both sides of moves and propagate git failures
            git diff --no-renames --name-only -z "$base" "$head" >"$changed_paths"
          else
            git ls-tree -r --name-only -z "$head" >"$changed_paths"
          fi

          mapfile -d '' -t changed_files <"$changed_paths"

          changed=false

          for path in "${changed_files[@]}"; do
            if [[ "${IGNORE_DOCS}" == "true" ]]; then
              case "${path}" in
                *.md | \
                *.mdx | \
                *.txt | \
                LICENSE | \
                */LICENSE | \
                docs/* | \
                */docs/*)
                  continue
                  ;;
              esac
            fi

            for prefix in "${watched[@]}"; do
              prefix="${prefix#./}"
              prefix="${prefix#/}"
              prefix="${prefix%/}"
              if [[ "$prefix" == "." || "$path" == "$prefix" || "$path" == "$prefix/"* ]]; then
                changed=true
                break 2
              fi
            done
          done

          echo "changed=${changed}" >>"${GITHUB_OUTPUT}"
