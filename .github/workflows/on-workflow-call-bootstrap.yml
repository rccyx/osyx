name: bootstrap

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trixie:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: build blank Trixie fixture
        run: docker build -t osyx-bootstrap-trixie .github/images/trixie -f .github/images/trixie/bootstrap.Dockerfile

      - name: render the provisioning plan
        shell: bash
        run: |
          if ! docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            osyx-bootstrap-trixie ./provisioning/main plan \
            --user smoke --locale en_US.UTF-8 --timezone Etc/UTC >bootstrap.log 2>&1; then
            cat bootstrap.log
            exit 1
          fi
          printf '%s\n' 'Provisioning plan saved to the bootstrap-trixie-plan artifact.'

      - name: upload bootstrap log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-trixie-plan
          path: bootstrap.log
          if-no-files-found: ignore
