name: bootstrap

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trixie:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: verify test checkout
        shell: bash
        run: |
          set -euo pipefail
          test_file=provisioning/tests/test_provisioning.py
          if ! git ls-files --error-unmatch -- "$test_file" >/dev/null 2>&1 || ! test -f "$test_file"; then
            echo "::error file=$test_file::Missing provisioning test suite. Commit the test file before running bootstrap CI."
            exit 1
          fi

      - name: build Debian fixture
        run: |
          docker build --pull \
            -t osyx-bootstrap-trixie \
            -f .github/images/trixie/bootstrap.Dockerfile \
            .github/images/trixie

      - name: test provisioning lifecycle
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            osyx-bootstrap-trixie \
            bash /workspace/.github/workflows/scripts/bootstrap-test.sh \
            2>&1 | tee bootstrap.log

      - name: upload bootstrap log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-trixie-log
          path: bootstrap.log
          if-no-files-found: ignore